site_name: TlopChen 知识库
site_description: 网络运维 / RouterOS / 架构复盘 / GitHub 学习笔记
site_url: https://tlopchen.github.io/wiki
theme:
  name: material
  language: zh
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search
  - blog:
      blog_dir: blog
      archive_name: 时间归档
      categories_name: 分类
      pagination_per_page: 10
  - tags
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
nav:
  - 首页: index.md
  - 复盘笔记: blog/index.md
  - 标签索引: tags.md
  - 网络运维:
      - 家庭网络总览: network/home-lab.md
      - 双线出口与分流: network/dual-wan-routing.md
      - 隧道速查: network/tunnels.md
      - DNS 防污染: network/dns-architecture.md
      - ROS 规则管线: network/ros-rules-pipeline.md
      - 坑与排障手册: network/pitfalls.md
  - GitHub 学习:
      - Git 基础操作: github/git-basics.md
      - Pages 与 Actions: github/pages-actions.md
